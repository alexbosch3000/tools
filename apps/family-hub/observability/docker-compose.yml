# Local observability stack: family-hub built from this directory's parent, exporting traces, logs
# and metrics over OTLP to grafana/otel-lgtm (OpenTelemetry Collector, Tempo, Loki, Prometheus, Grafana).
# Start with `make observe`, then open Grafana on http://localhost:3000 (admin / admin).
name: family-hub-observability

services:
  lgtm:
    image: grafana/otel-lgtm:0.39.0@sha256:4c8056c9c05fcb3c8fd93800e85334bfd79b4d0271b47a54a121a64af41fe1fe
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/family-hub.json
    volumes:
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
      - ./grafana/family-hub.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/family-hub.json:ro

  family-hub:
    build: ..
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:exec
      - /data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Setting the endpoint attaches the OpenTelemetry agent (see docker-entrypoint.sh).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=tools,service.version=local,deployment.environment.name=local
    depends_on:
      - lgtm
