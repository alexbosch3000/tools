# NGINX server for the single-page application.
# Listens on 8080 (non-root), logs JSON to stdout and exposes /healthz for probes.

log_format json escape=json '{'
  '"time":"$time_iso8601",'
  '"remote_addr":"$remote_addr",'
  '"method":"$request_method",'
  '"uri":"$request_uri",'
  '"status":$status,'
  '"bytes_sent":$body_bytes_sent,'
  '"duration_s":$request_time,'
  '"user_agent":"$http_user_agent",'
  '"request_id":"$request_id"'
'}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    access_log /dev/stdout json;
    error_log  /dev/stderr warn;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    # Fingerprinted build output can be cached forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Unknown paths fall back to index.html so client-side routes work on reload.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
