<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestionnaire de tâches</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">
    <header class="app-header">
      <h1>Gestionnaire de tâches</h1>
      <button class="btn btn-primary" id="btn-new-task">+ Nouvelle tâche</button>
    </header>

    <!-- Barre de filtres -->
    <div class="toolbar">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">Toutes</button>
        <button class="filter-btn" data-filter="active">En cours</button>
        <button class="filter-btn" data-filter="upcoming">À venir</button>
        <button class="filter-btn" data-filter="overdue">En retard</button>
        <button class="filter-btn" data-filter="done">Terminées</button>
      </div>
      <input class="search-input" id="search" type="text" placeholder="Rechercher une tâche…" />
    </div>

    <!-- Liste des tâches -->
    <main class="task-list" id="task-list">
      <!-- injecté par JS -->
    </main>

    <p class="empty-state" id="empty-state" hidden>Aucune tâche pour ce filtre.</p>
  </div>

  <!-- Modal : formulaire de tâche -->
  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title">Nouvelle tâche</h2>
        <button class="modal-close" id="modal-close" aria-label="Fermer">&#x2715;</button>
      </div>

      <form id="task-form" novalidate>
        <input type="hidden" id="task-id" />

        <div class="form-group">
          <label for="task-title">Titre <span class="required">*</span></label>
          <input type="text" id="task-title" placeholder="Nom de la tâche" required />
        </div>

        <div class="form-group">
          <label for="task-desc">Description</label>
          <textarea id="task-desc" rows="3" placeholder="Détails optionnels…"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="task-start">Date de début</label>
            <input type="date" id="task-start" />
          </div>
          <div class="form-group">
            <label for="task-end">Date de fin</label>
            <input type="date" id="task-end" />
          </div>
        </div>

        <div class="form-group">
          <label for="task-priority">Priorité</label>
          <select id="task-priority">
            <option value="low">Basse</option>
            <option value="medium" selected>Moyenne</option>
            <option value="high">Haute</option>
          </select>
        </div>

        <div class="form-error" id="form-error" hidden></div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="btn-cancel">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
