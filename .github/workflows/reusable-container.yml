# Reusable job: builds an app's container image, scans it, and on the default
# branch pushes it to GHCR with a signed build provenance attestation.
name: reusable-container

on:
  workflow_call:
    inputs:
      app:
        description: App directory name under apps/ (also the image name)
        required: true
        type: string
      push:
        description: Push the image and attest it
        required: false
        type: boolean
        default: false
    outputs:
      digest:
        description: Digest of the pushed image (empty when not pushed)
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ inputs.app }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}/apps/${{ inputs.app }}

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ inputs.app }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}

      - name: Smoke test
        env:
          APP: ${{ inputs.app }}
          IMAGE_REF: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: make -C "apps/$APP" smoke IMAGE="$IMAGE_REF"

      - name: Scan for vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity-cutoff: high
          only-fixed: true
          output-format: table

      - if: inputs.push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: inputs.push
        id: push
        name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ inputs.app }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.app }}

      - if: inputs.push
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
