# Reusable job: verifies a Java app through its Makefile (lint, test, audit, build).
# The JDK comes from the app's .java-version so CI and developers use the same one. An app that
# embeds a Node.js front end names its directory in `node-dir`, and Node.js comes from its .nvmrc.
# With `pages: true`, on the default branch it also builds that front end alone for GitHub Pages
# (`make pages`) and uploads <node-dir>/dist for reusable-pages.yml.
name: reusable-java

on:
  workflow_call:
    inputs:
      app:
        description: App directory name under apps/
        required: true
        type: string
      node-dir:
        description: Directory of a Node.js front end, relative to the app (e.g. web); empty for none
        required: false
        type: string
        default: ''
      pages:
        description: Build and upload the GitHub Pages artifact on the default branch (requires node-dir)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version-file: apps/${{ inputs.app }}/.java-version
          cache: maven
          cache-dependency-path: apps/${{ inputs.app }}/**/pom.xml

      - if: inputs.node-dir != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/${{ inputs.app }}/${{ inputs.node-dir }}/.nvmrc
          cache: npm
          cache-dependency-path: apps/${{ inputs.app }}/${{ inputs.node-dir }}/package-lock.json

      - run: make ci

      - name: Build for GitHub Pages
        if: inputs.pages && github.ref_name == github.event.repository.default_branch
        run: make pages BASE_PATH=/${{ github.event.repository.name }}/

      - if: inputs.pages && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/${{ inputs.app }}/${{ inputs.node-dir }}/dist
