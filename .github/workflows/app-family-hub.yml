# CI/CD for apps/family-hub: verify (Java service and its React front end) and scan on every change,
# then publish the image to GHCR from the default branch. The image is the deliverable: it is
# deployed where it runs (Synology NAS, container platform), outside this repository.
name: app-family-hub

on:
  push:
    branches: [main]
    paths:
      - apps/family-hub/**
      - .github/workflows/app-family-hub.yml
      - .github/workflows/reusable-java.yml
      - .github/workflows/reusable-container.yml
  pull_request:
    paths:
      - apps/family-hub/**
      - .github/workflows/app-family-hub.yml
      - .github/workflows/reusable-java.yml
      - .github/workflows/reusable-container.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    uses: ./.github/workflows/reusable-java.yml
    with:
      app: family-hub
      node-dir: web

  container:
    needs: verify
    uses: ./.github/workflows/reusable-container.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      app: family-hub
      push: ${{ github.ref == 'refs/heads/main' }}
