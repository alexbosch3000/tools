# Déploie tasks-app sur GitHub Pages à chaque push sur main
name: Deploy tasks-app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['tasks-app/**']
  workflow_dispatch:   # permet de déclencher manuellement depuis l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; annule l'éventuel déploiement en cours
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tasks-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tasks-app

      - name: Build
        run: npm run build
        working-directory: tasks-app
        env:
          VITE_BASE: /tools/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tasks-app/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
