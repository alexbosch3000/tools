# CI/CD for apps/my-todo-list: verify and scan on every change, then publish the
# image to GHCR from the default branch.
name: app-my-todo-list

on:
  push:
    branches: [main]
    paths:
      - apps/my-todo-list/**
      - .github/workflows/app-my-todo-list.yml
      - .github/workflows/reusable-node.yml
      - .github/workflows/reusable-container.yml
  pull_request:
    paths:
      - apps/my-todo-list/**
      - .github/workflows/app-my-todo-list.yml
      - .github/workflows/reusable-node.yml
      - .github/workflows/reusable-container.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    uses: ./.github/workflows/reusable-node.yml
    with:
      app: my-todo-list

  container:
    needs: verify
    uses: ./.github/workflows/reusable-container.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      app: my-todo-list
      push: ${{ github.ref == 'refs/heads/main' }}
