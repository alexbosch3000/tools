# Reusable job: verifies a Node.js app through its Makefile (lint, test, audit, build).
name: reusable-node

on:
  workflow_call:
    inputs:
      app:
        description: App directory name under apps/
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/${{ inputs.app }}/.nvmrc
          cache: npm
          cache-dependency-path: apps/${{ inputs.app }}/package-lock.json

      - run: make ci
