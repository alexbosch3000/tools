# Weekly dependency updates. App directories are matched by glob, so new apps
# under apps/ using an existing ecosystem are covered without editing this file.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directories: ['/apps/*']
    schedule:
      interval: weekly
    groups:
      react:
        patterns: [react, react-dom]
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Tailwind CSS 4 replaces the PostCSS plugin and renames utilities: migrate on purpose.
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']

  - package-ecosystem: maven
    directories: ['/apps/*']
    schedule:
      interval: weekly
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: ['/apps/*']
    schedule:
      interval: weekly
    ignore:
      # Runtime majors follow the LTS releases and move together with .nvmrc and .java-version.
      - dependency-name: node
        update-types: ['version-update:semver-major']
      - dependency-name: eclipse-temurin
        update-types: ['version-update:semver-major']
      - dependency-name: maven
        update-types: ['version-update:semver-major']
