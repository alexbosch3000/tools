# Weekly dependency updates. App directories are matched by glob, so new apps
# under apps/ using an existing ecosystem are covered without editing this file.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directories: ['/apps/*']
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: ['/apps/*']
    schedule:
      interval: weekly
